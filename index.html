<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cows and Bulls</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Cows and Bulls</h1>

  <label>
    <input type="checkbox" id="advancedToggle">
    Advanced mode (unique digits only)
  </label>

  <label>
    <input type="checkbox" id="historyToggle">
    Show history
  </label>

  <p>Guess the 4-digit secret number.</p>
  <input type="text" id="guessInput" maxlength="4" placeholder="Enter your guess">
  <button id="submitBtn">Submit</button>

  <p id="result"></p>
  <p id="attemptsCount"></p>

  <aside id="historyPanel" style="display: none;">
    <h2>History</h2>
    <table>
      <thead>
        <tr>
          <th>Guess</th>
          <th>Bulls / Cows</th>
        </tr>
      </thead>
      <tbody id="historyBody"></tbody>
    </table>
  </aside>

  <script type="module" src="script.js"></script>
</body>
</html>
